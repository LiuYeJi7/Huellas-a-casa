<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huellas a casa - Adopta un amigo</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container">
                <a class="navbar-brand fw-bold" href="#">Huellas a casa</a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <div class="collapse navbar-collapse" id="menuNavegacion">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="#">Inicio</a>
                        </li>
                    </ul>
                    
                    <button class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#modalCarrito">
                        Apadrinados: <span id="contador-carrito" class="badge bg-danger">0</span>
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="py-5 text-center bg-white">
            <div class="container">
                <h1>Dale un hogar a un perrito</h1>
                <p>Nuestros peluditos están esperando una familia. Adopta o apadrina.</p>
            </div>
        </section>

        <section class="py-4 bg-light">
            <div class="container">
                <h2 class="text-center mb-4">Catálogo de Perritos</h2>
                
                <div class="text-center mb-4">
                    <button class="btn btn-outline-dark btn-filtro" data-categoria="todos">Ver Todos</button>
                    <button class="btn btn-outline-dark btn-filtro" data-categoria="pequeño">Pequeños</button>
                    <button class="btn btn-outline-dark btn-filtro" data-categoria="mediano">Medianos</button>
                    <button class="btn btn-outline-dark btn-filtro" data-categoria="grande">Grandes</button>
                </div>

                <div class="row" id="contenedor-perritos">
                    </div>
            </div>
        </section>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-4">
        <p>&copy; 2026 Refugio Peluditos. Proyecto de Diseño Web.</p>
    </footer>

    <div class="modal fade" id="modalDetalle" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-titulo">Nombre</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="modal-img" src="" alt="Foto perrito" class="img-fluid mb-3" style="max-height: 200px;">
                    <p id="modal-desc">Descripcion</p>
                    <h4 id="modal-precio" class="text-primary">S/ 0</h4>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-success" id="modal-btn-agregar">Apadrinar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalCarrito" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Tu Lista de Apadrinamiento</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <p>Revisa tu lista antes de confirmar.</p>
                    
                    <div id="items-carrito"></div>
                    <h5 class="text-end mt-3">Total: <span id="total-carrito">S/ 0</span></h5>
                    
                    <hr>
                    
                    <form id="formulario-adopcion">
                        <div class="mb-3">
                            <label>Nombre Completo</label>
                            <input type="text" id="input-nombre" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label>DNI</label>
                            <input type="text" id="input-dni" class="form-control">
                        </div>
                        <div id="mensaje-error-form" class="alert alert-danger d-none"></div>
                        <button type="submit" class="btn btn-primary w-100">Confirmar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
